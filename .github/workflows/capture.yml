name: Capture Bambu Studio global OTA profiles

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bambu-studio-global-ota-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete archive history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test archive safety and polling behavior
        run: |
          python -m unittest discover -s tests -v
          python -m bambu_ota_archive.cli audit
        env:
          PYTHONPATH: src

      - name: Capture changed global profile packs
        run: |
          set -euo pipefail
          git config user.name "bambu-ota-archive[bot]"
          git config user.email "bambu-ota-archive[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config tag.gpgsign false
          PYTHONPATH=src python -m bambu_ota_archive.cli poll --commit

      - name: Push commits and annotated tags when present
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${GITHUB_REF_NAME}..HEAD"; then
            echo "No new pack commits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
          echo "Captured and pushed new global OTA profile pack commits." >> "$GITHUB_STEP_SUMMARY"
