[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-studio-ota-archive"
version = "0.1.0"
description = "Evidence-backed archiver for global Bambu Studio OTA profile packs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bambu-ota-archive = "bambu_ota_archive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

